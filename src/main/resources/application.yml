spring:
  application:
    name: aegis
  jmx:
    enabled: false
  main:
    banner-mode: "off"
    log-startup-info: false
  mvc:
    problemdetails:
      enabled: true

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-components: never
      show-details: never
    info:
      access: read-only
  info:
    defaults:
      enabled: false

logging:
  structured:
    format:
      console: logstash

aegis:
  build:
    commit-sha: ${AEGIS_COMMIT_SHA:}
